# Source: govuk-datagovuk/templates/datagovuk/datagovuk-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-datagovuk
  labels:
    app: release-name-datagovuk
    app.kubernetes.io/name: release-name-datagovuk
    app.kubernetes.io/component: app
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: release-name-datagovuk
  template:
    metadata:
      labels:
        app: release-name-datagovuk
        app.kubernetes.io/name: release-name-datagovuk
        app.kubernetes.io/arch: amd64
    spec:
      containers:
        - name: datagovuk
          image: 'ghcr.io/alphagov/datagovuk:5899c2fa620b7a0f6b7b64bda3f472445a14a0f5'
          command: ["/bin/sh","-c","/start"]
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9394
          env:
             
            - name: USE_DOCKER
              value: "True"
            - name: DJANGO_ALLOWED_HOSTS
              value: "datagovuk.eks.test.govuk.digital,find.eks.test.govuk.digital,www.development.data.gov.uk,www.data.gov.uk"
            - name: SENTRY_ENVIRONMENT
              value: development
            - name: GOOGLE_TAG_MANAGER_ID
              value: GTM-5WRWCH8X
            - name: DJANGO_SECURE_SSL_REDIRECT
              value: "False"
            
            - name: BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: datagovuk
                  key: basic_auth_name
            - name: BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datagovuk
                  key: basic_auth_password
            - name: BASIC_AUTH_BYPASS
              valueFrom:
                secretKeyRef:
                  name: datagovuk
                  key: basic_auth_bypass
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: datagovuk
                  key: django_secret_key
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: datagovuk
                  key: datagovuk_sentry_dsn
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SOLR_URL
              value: http://ckan-dev-solr/solr/ckan
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/
              port: http
            periodSeconds: 5
            successThreshold: 3
            timeoutSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-tmp
              mountPath: /app/tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-tmp
          emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
