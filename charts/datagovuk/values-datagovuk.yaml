apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: find
spec:
  
  rules:
    - host: find.eks.test.govuk.digital
      http:
        paths:
          - path: /search
            pathType: Prefix
            backend:
              service:
                name: release-name-find
                port:
                  number: 3000
          - path: /dataset
            pathType: Prefix
            backend:
              service:
                name: release-name-find
                port:
                  number: 3000
          - path: /data/search
            pathType: Prefix
