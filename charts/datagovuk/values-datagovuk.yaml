# Source: govuk-datagovuk/templates/find/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-find
  labels:
    app: release-name-find
    app.kubernetes.io/name: release-name-find
    app.kubernetes.io/component: app
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: release-name-find
  template:
    metadata:
      labels:
        app: release-name-find
        app.kubernetes.io/name: release-name-find
        app.kubernetes.io/arch: amd64
    spec:
      containers:
        - name: find
          image: 'ghcr.io/alphagov/datagovuk_find:v4.3.0'
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9394
          env:
            
            - name: CKAN_DOMAIN
              value: ckan.development.publishing.service.gov.uk
            - name: ES_HOST
              value: http://release-name-opensearch-sts
            - name: ES_INDEX
              value: datasets-development
            - name: GOVUK_APP_DOMAIN
              value: "www.gov.uk"
            - name: GOVUK_ENVIRONMENT
              value: development
            - name: GOVUK_PROMETHEUS_EXPORTER
              value: "force"
            - name: GOVUK_WEBSITE_ROOT
              value: "https://www.gov.uk"
            - name: RAILS_LOG_LEVEL
              value: "warn"
            - name: RAILS_LOG_TO_STDOUT
              value: "1"
            - name: RAILS_DEVELOPMENT_HOSTS
              value: find.eks.test.govuk.digital
            - name: RAILS_SERVE_STATIC_FILES
              value: "1"
            - name: RAILS_MAX_THREADS
              value: "5"
            - name: RATE_LIMIT_COUNT
              value: "100"
            - name: RATE_LIMIT_PERIOD
              value: "60"
            
            - name: SECRET_KEY_BASE
              value: dummy
            
            - name: SENTRY_DSN
              value: dummy
            
            - name: SOLR_URL
              value: http://ckan-dev-solr/solr/ckan
            - name: ZENDESK_API_KEY
              value: dummy
            
            - name: ZENDESK_END_POINT
              value: "https://govuk.zendesk.com/api/v2"
            - name: ZENDESK_USERNAME
              value: dummy
            
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 60
            timeoutSeconds: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            successThreshold: 3
            timeoutSeconds: 30
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 60
          volumeMounts:
            - name: app-tmp
              mountPath: /srv/app/datagovuk_find/tmp
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app-tmp
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
