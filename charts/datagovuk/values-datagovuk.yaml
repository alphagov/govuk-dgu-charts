              service:
                name: release-name-find
                port:
                  number: 3000
          - path: /ckan_maintenance
            pathType: Prefix
            backend:
              service:
                name: release-name-find
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: release-name-find
                port:
                  number: 3000
          - path: /harvest
            pathType: Prefix
            backend:
              service:
                name: release-name-find
                port:
                  number: 3000
          - path: /user/login
            pathType: Prefix
            backend:
              service:
                name: release-name-find
                port:
                  number: 3000
          - path: /find-assets
            pathType: Prefix
            backend:
              service:
                name: release-name-find
                port:
                  number: 3000
          - path: /javascript
            pathType: Prefix
            backend:
              service:
                name: release-name-find
                port:
                  number: 3000
          - path: /search.html
            pathType: Prefix
            backend:
              service:
                name: release-name-find
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: release-name-datagovuk
                port:
                  number: 8000
    - host: datagovuk-directory.eks.test.govuk.digital
      http:
        paths:
          - path: /
