{{- if .Values.script.enabled }}
{{- $fullName := (print .Release.Name "-ckan-script-set") -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}
  labels:
    app: {{ $fullName }}
    app.kubernetes.io/name: {{ $fullName }}
data:
  script-set.sh: |-
    {{- if .Values.script.shell_url }}
    wget "{{ .Values.script.shell_url }}" -O "/script/script-run.sh"
    {{- end -}}
    {{- if .Values.script.url }}
    wget "{{ .Values.script.url }}" -O "/script/script.py"
    {{- end -}}
    {{- if .Values.script.url_2 }}
    wget "{{ .Values.script.url_2 }}" -O "/script/script-2.py"
    {{- end -}}
    {{- if .Values.script.requirementsUrl }}
    wget "{{ .Values.script.requirementsUrl }}" -O "/script/requirements.txt"
    {{- end -}}
    {{- if .Values.script.dataUrl }}
    wget "{{ .Values.script.dataUrl }}" -O "/script/data.file"
    {{- end -}}
    {{- if .Values.script.dataUrl_2 }}
    wget "{{ .Values.script.dataUrl_2 }}" -O "/script/data-2.file"
    {{- end -}}
{{- end }}
