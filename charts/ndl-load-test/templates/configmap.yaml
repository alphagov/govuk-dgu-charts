apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-script
  namespace: {{ .Release.Namespace }}
data:
  script.js: |
    // Enhanced k6 load test for CKAN
    // Personas: Anonymous Explorer (55%), API Consumer (25%), Harvest Worker (15%), Admin (5%)
    // All configuration via environment variables (no code changes needed)

    import http from 'k6/http';
    import { check, sleep, group } from 'k6';
    import { Rate, Trend, Counter } from 'k6/metrics';

    const errorRate = new Rate('errors');
    const apiErrorCount = new Counter('ckan_api_errors');
    const apiLatency = new Trend('api_latency');

    // Configuration from environment
    const DATAGOVUK_URL = __ENV.DATAGOVUK_URL;
    const CKAN_URL = __ENV.CKAN_URL;
    const DATAGOVUK_QUERY = __ENV.DATAGOVUK_QUERY || 'climate';
    const CKAN_QUERY = __ENV.CKAN_QUERY || 'climate';
    const CKAN_ROWS = parseInt(__ENV.CKAN_ROWS) || 5;
    const TEST_PROFILE = __ENV.TEST_PROFILE || 'baseline';

    const VUS = parseInt(__ENV.VUS) || 50;
    const WARMUP_DURATION = __ENV.WARMUP_DURATION || '2m';
    const RAMP_DURATION = __ENV.RAMP_DURATION || '2m';
    const SOAK_DURATION = __ENV.SOAK_DURATION || '30m';

    const HOMEPAGE_THRESHOLD = parseInt(__ENV.HOMEPAGE_THRESHOLD_MS) || 2000;
    const SEARCH_THRESHOLD = parseInt(__ENV.SEARCH_THRESHOLD_MS) || 2000;
    const DATASET_THRESHOLD = parseInt(__ENV.DATASET_THRESHOLD_MS) || 2000;
    const CKAN_API_THRESHOLD = parseInt(__ENV.CKAN_API_THRESHOLD_MS) || 3000;
    const ERROR_RATE_THRESHOLD = parseFloat(__ENV.ERROR_RATE_THRESHOLD) || 0.01;

    // Security: Verify staging
    if (!DATAGOVUK_URL.includes('staging')) {
      throw new Error(`ERROR: Invalid DATAGOVUK_URL. Must target staging. Got: ${DATAGOVUK_URL}`);
    }

    // Test profiles
    const baselineProfile = {
      stages: [
        { duration: WARMUP_DURATION, target: 1 },
        { duration: RAMP_DURATION, target: VUS },
        { duration: SOAK_DURATION, target: VUS },
        { duration: WARMUP_DURATION, target: 0 },
      ],
      thresholds: {
        'http_req_duration{type:homepage}': [`p(95)<${HOMEPAGE_THRESHOLD}`],
        'http_req_duration{type:search}': [`p(95)<${SEARCH_THRESHOLD}`],
        'http_req_duration{type:dataset}': [`p(95)<${DATASET_THRESHOLD}`],
        'http_req_duration{type:ckan_api}': [`p(95)<${CKAN_API_THRESHOLD}`],
        'errors': [`rate<${ERROR_RATE_THRESHOLD}`],
      },
    };

    const stressProfile = {
      stages: [
        { duration: '5m', target: 5 },
        { duration: '10m', target: 25 },
        { duration: '10m', target: 25 },
        { duration: '10m', target: 50 },
        { duration: '10m', target: 50 },
        { duration: '10m', target: 75 },
        { duration: '10m', target: 75 },
        { duration: '5m', target: 0 },
      ],
      thresholds: {
        'http_req_duration': [`p(95)<10000`],
        'errors': [`rate<0.05`],
      },
    };

    const sustainedProfile = {
      stages: [
        { duration: '5m', target: VUS },
        { duration: '120m', target: VUS },
        { duration: '5m', target: 0 },
      ],
      thresholds: {
        'http_req_duration{type:ckan_api}': [`p(95)<${CKAN_API_THRESHOLD}`],
        'errors': [`rate<${ERROR_RATE_THRESHOLD}`],
      },
    };

    let selectedProfile = baselineProfile;
    if (TEST_PROFILE === 'stress') {
      selectedProfile = stressProfile;
    } else if (TEST_PROFILE === 'sustained') {
      selectedProfile = sustainedProfile;
    }

    export const options = selectedProfile;

    // Persona 1: Anonymous Explorer (55%)
    function anonymousExplorer() {
      group('Persona: Anonymous Explorer', () => {
        let res = http.get(`${DATAGOVUK_URL}/`, { tags: { type: 'homepage' } });
        check(res, { 'homepage: 200': (r) => r.status === 200 });
        errorRate.add(res.status !== 200);
        sleep(2);

        res = http.get(`${DATAGOVUK_URL}/search?q=${DATAGOVUK_QUERY}`, { tags: { type: 'search' } });
        check(res, { 'search: 200': (r) => r.status === 200 });
        errorRate.add(res.status !== 200);
        sleep(3);

        res = http.get(`${CKAN_URL}/dataset`, { tags: { type: 'dataset' } });
        check(res, { 'dataset: 200': (r) => r.status === 200 });
        errorRate.add(res.status !== 200);
        sleep(2);
      });
    }

    // Persona 2: API Consumer (25%)
    function apiConsumer() {
      group('Persona: API Consumer', () => {
        const url = `${CKAN_URL}/api/3/action/package_search?q=${CKAN_QUERY}&rows=${CKAN_ROWS}`;
        let res = http.get(url, { tags: { type: 'ckan_api' } });
        check(res, { 'api: 200': (r) => r.status === 200 });
        if (res.status !== 200) {
          apiErrorCount.add(1);
        }
        errorRate.add(res.status !== 200);
        sleep(1);
      });
    }

    // Persona 3: Harvest Worker (15%)
    function harvestWorker() {
      group('Persona: Harvest Worker', () => {
        for (let i = 0; i < 3; i++) {
          let res = http.get(`${CKAN_URL}/api/3/action/organization_list?limit=50`,
            { tags: { type: 'ckan_api', operation: 'harvest' } });
          check(res, { 'harvest: 200': (r) => r.status === 200 });
          errorRate.add(res.status !== 200);
          sleep(0.5);
        }
      });
    }

    // Persona 4: Admin (5%)
    function adminEditor() {
      group('Persona: Admin', () => {
        let res = http.get(`${DATAGOVUK_URL}/dashboard`, { tags: { type: 'dashboard' } });
        check(res, { 'dashboard: 200': (r) => r.status === 200 || r.status === 404 });
        sleep(2);
      });
    }

    export default function () {
      const rand = Math.random();
      if (rand < 0.55) {
        anonymousExplorer();
      } else if (rand < 0.80) {
        apiConsumer();
      } else if (rand < 0.95) {
        harvestWorker();
      } else {
        adminEditor();
      }
    }

    export function setup() {
      console.log('Starting CKAN Load Test: ' + TEST_PROFILE + ' profile, ' + VUS + ' VUs');
      const resp = http.get(DATAGOVUK_URL, { timeout: '10s' });
      if (!resp.url.includes('staging')) {
        throw new Error('ERROR: Not targeting staging');
      }
      return {};
    }

    export function teardown() {
      console.log('Test complete. Total API errors: ' + apiErrorCount.value);
    }
