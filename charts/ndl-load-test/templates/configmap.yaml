apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-script
  namespace: {{ .Release.Namespace }}
data:
  script.js: |
    // chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    // CKAN load test with 4 profiles, 8 endpoints, dynamic dataset/harvest ID selection
    import http from 'k6/http';
    import { check, sleep } from 'k6';
    import { Rate } from 'k6/metrics';

    const errorRate = new Rate('errors');

    // Configuration from environment
    const CKAN_URL = __ENV.CKAN_URL || 'https://ckan.eks.staging.govuk.digital';
    const TEST_PROFILE = __ENV.TEST_PROFILE || 'baseline';
    const ISOLATION_ENDPOINT = __ENV.ISOLATION_ENDPOINT || '';
    const VUS = parseInt(__ENV.VUS) || 50;

    // Thresholds for each endpoint (milliseconds) — use defaults if env vars empty
    const THRESHOLDS = {
      search_ui: (__ENV.SEARCH_UI_THRESHOLD_MS ? parseInt(__ENV.SEARCH_UI_THRESHOLD_MS) : 500) || 500,
      package_search: (__ENV.PACKAGE_SEARCH_THRESHOLD_MS ? parseInt(__ENV.PACKAGE_SEARCH_THRESHOLD_MS) : 2000) || 2000,
      package_list: (__ENV.PACKAGE_LIST_THRESHOLD_MS ? parseInt(__ENV.PACKAGE_LIST_THRESHOLD_MS) : 2000) || 2000,
      package_show: (__ENV.PACKAGE_SHOW_THRESHOLD_MS ? parseInt(__ENV.PACKAGE_SHOW_THRESHOLD_MS) : 3000) || 3000,
      organization_show: (__ENV.ORGANIZATION_SHOW_THRESHOLD_MS ? parseInt(__ENV.ORGANIZATION_SHOW_THRESHOLD_MS) : 3000) || 3000,
      harvest_source_list: (__ENV.HARVEST_SOURCE_LIST_THRESHOLD_MS ? parseInt(__ENV.HARVEST_SOURCE_LIST_THRESHOLD_MS) : 2000) || 2000,
      harvest_object: (__ENV.HARVEST_OBJECT_THRESHOLD_MS ? parseInt(__ENV.HARVEST_OBJECT_THRESHOLD_MS) : 3000) || 3000,
    };
    const ERROR_RATE_THRESHOLD = (__ENV.ERROR_RATE_THRESHOLD ? parseFloat(__ENV.ERROR_RATE_THRESHOLD) : 0.01) || 0.01;

    // Data pool from setup() — will be populated with dataset IDs and harvest object IDs
    let datasetIds = [];
    let harvestObjectIds = [];

    // Setup: fetch 100 dataset IDs and harvest object IDs for dynamic selection
    export function setup() {
      if (CKAN_URL.includes('production')) {
        throw new Error('ERROR: CKAN_URL contains "production" - will not load test production');
      }

      console.log(`Setup: fetching dataset pool from ${CKAN_URL}`);
      let res = http.get(`${CKAN_URL}/api/3/action/package_search?q=*&rows=100`, {
        timeout: '10s',
      });

      if (res.status !== 200) {
        throw new Error(`Failed to fetch datasets: ${res.status}`);
      }

      try {
        const data = JSON.parse(res.body);
        datasetIds = data.result.results.map(pkg => pkg.id);
        console.log(`Setup: fetched ${datasetIds.length} dataset IDs`);
      } catch (e) {
        throw new Error(`Failed to parse dataset response: ${e}`);
      }

      // Fetch harvest objects if needed for harvest_object endpoint
      res = http.get(`${CKAN_URL}/api/3/action/harvest_object_list?limit=100`, {
        timeout: '10s',
      });

      if (res.status === 200) {
        try {
          const data = JSON.parse(res.body);
          if (data.result && data.result.results) {
            harvestObjectIds = data.result.results.map(obj => obj.id);
            console.log(`Setup: fetched ${harvestObjectIds.length} harvest object IDs`);
          }
        } catch (e) {
          console.log(`Setup: could not fetch harvest objects (not critical): ${e}`);
        }
      }

      return { datasetIds, harvestObjectIds };
    }

    // Define test stages based on profile
    let stages = [];
    if (TEST_PROFILE === 'baseline') {
      stages = [
        { duration: '2m', target: 50 },
        { duration: '25m', target: 50 },
        { duration: '3m', target: 0 },
      ];
    } else if (TEST_PROFILE === 'stress') {
      stages = [
        { duration: '3m', target: 50 },
        { duration: '5m', target: 50 },
        { duration: '5m', target: 75 },
        { duration: '10m', target: 75 },
        { duration: '5m', target: 100 },
        { duration: '10m', target: 100 },
        { duration: '2m', target: 0 },
      ];
    } else if (TEST_PROFILE === 'isolation') {
      stages = [
        { duration: '2m', target: 50 },
        { duration: '28m', target: 50 },
      ];
    } else if (TEST_PROFILE === 'sustained') {
      stages = [
        { duration: '2m', target: 75 },
        { duration: '116m', target: 75 },
        { duration: '2m', target: 0 },
      ];
    }

    // Build thresholds object
    let thresholdObj = {
      'http_req_duration{endpoint:search_ui}': [`p(95)<${THRESHOLDS.search_ui}`],
      'http_req_duration{endpoint:package_search}': [`p(95)<${THRESHOLDS.package_search}`],
      'http_req_duration{endpoint:package_list}': [`p(95)<${THRESHOLDS.package_list}`],
      'http_req_duration{endpoint:package_show}': [`p(95)<${THRESHOLDS.package_show}`],
      'http_req_duration{endpoint:organization_show}': [`p(95)<${THRESHOLDS.organization_show}`],
      'http_req_duration{endpoint:harvest_source_list}': [`p(95)<${THRESHOLDS.harvest_source_list}`],
      'http_req_duration{endpoint:harvest_object}': [`p(95)<${THRESHOLDS.harvest_object}`],
      'errors': [`rate<${ERROR_RATE_THRESHOLD}`, {abortOnFail: true}],
    };

    export const options = {
      stages: stages,
      thresholds: thresholdObj,
    };

    export default function (data) {
      // Extract data from setup
      const ds = data.datasetIds || [];
      const ho = data.harvestObjectIds || [];

      if (ISOLATION_ENDPOINT) {
        // Run only one endpoint (for isolation profile)
        runEndpoint(ISOLATION_ENDPOINT, ds, ho);
      } else {
        // Run all endpoints with weighted distribution
        const rand = Math.random();
        if (rand < 0.15) runSearchUI();
        else if (rand < 0.35) runPackageSearchAll();
        else if (rand < 0.47) runPackageSearchHealth();
        else if (rand < 0.59) runPackageList();
        else if (rand < 0.74) runPackageShow(ds);
        else if (rand < 0.86) runOrganizationShow();
        else if (rand < 0.96) runHarvestSourceList();
        else runHarvestObject(ho);
      }

      sleep(1);
    }

    function runEndpoint(endpoint, ds, ho) {
      if (endpoint === 'search_ui') runSearchUI();
      else if (endpoint === 'package_search') runPackageSearchAll();
      else if (endpoint === 'package_list') runPackageList();
      else if (endpoint === 'package_show') runPackageShow(ds);
      else if (endpoint === 'organization_show') runOrganizationShow();
      else if (endpoint === 'harvest_source_list') runHarvestSourceList();
      else if (endpoint === 'harvest_object') runHarvestObject(ho);
    }

    function runSearchUI() {
      let res = http.get(`${CKAN_URL}/search/dataset`, {
        tags: { endpoint: 'search_ui' },
      });
      check(res, {
        'search_ui: status 200': (r) => r.status === 200,
      });
      errorRate.add(res.status !== 200);
    }

    function runPackageSearchAll() {
      let res = http.get(`${CKAN_URL}/api/3/action/package_search?q=*&rows=5`, {
        tags: { endpoint: 'package_search' },
      });
      check(res, {
        'package_search_all: status 200': (r) => r.status === 200,
        'package_search_all: has results': (r) => {
          try {
            return JSON.parse(r.body).result.count > 0;
          } catch (e) {
            return false;
          }
        },
      });
      errorRate.add(res.status !== 200);
    }

    function runPackageSearchHealth() {
      let res = http.get(`${CKAN_URL}/api/3/action/package_search?q=health&rows=5`, {
        tags: { endpoint: 'package_search' },
      });
      check(res, {
        'package_search_health: status 200': (r) => r.status === 200,
      });
      errorRate.add(res.status !== 200);
    }

    function runPackageList() {
      let res = http.get(`${CKAN_URL}/api/3/action/package_list?limit=100`, {
        tags: { endpoint: 'package_list' },
      });
      check(res, {
        'package_list: status 200': (r) => r.status === 200,
      });
      errorRate.add(res.status !== 200);
    }

    function runPackageShow(datasetIds) {
      if (datasetIds.length === 0) {
        console.log('ERROR: no dataset IDs available');
        return;
      }
      const randomId = datasetIds[Math.floor(Math.random() * datasetIds.length)];
      let res = http.get(`${CKAN_URL}/api/3/action/package_show?id=${randomId}`, {
        tags: { endpoint: 'package_show' },
      });
      check(res, {
        'package_show: status 200': (r) => r.status === 200,
      });
      errorRate.add(res.status !== 200);
    }

    function runOrganizationShow() {
      let res = http.get(`${CKAN_URL}/api/3/action/organization_show?id=office-for-national-statistics`, {
        tags: { endpoint: 'organization_show' },
      });
      check(res, {
        'organization_show: status 200': (r) => r.status === 200,
      });
      errorRate.add(res.status !== 200);
    }

    function runHarvestSourceList() {
      let res = http.get(`${CKAN_URL}/api/3/action/harvest_source_list`, {
        tags: { endpoint: 'harvest_source_list' },
      });
      check(res, {
        'harvest_source_list: status 200': (r) => r.status === 200,
      });
      errorRate.add(res.status !== 200);
    }

    function runHarvestObject(harvestObjectIds) {
      if (harvestObjectIds.length === 0) {
        console.log('WARNING: no harvest object IDs, skipping this endpoint');
        return;
      }
      const randomId = harvestObjectIds[Math.floor(Math.random() * harvestObjectIds.length)];
      let res = http.get(`${CKAN_URL}/2/rest/harvestobject/${randomId}`, {
        tags: { endpoint: 'harvest_object' },
      });
      check(res, {
        'harvest_object: status 200': (r) => r.status === 200,
      });
      errorRate.add(res.status !== 200);
    }
