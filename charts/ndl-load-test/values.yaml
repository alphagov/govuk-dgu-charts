# Target URLs for load testing — staging only, never point this at production
# These are set as environment variables in the pod manifest for runtime tweaking
datagovuk_url: "https://www.staging.data.gov.uk"
ckan_url: "https://ckan.eks.staging.govuk.digital"

# Search and API query strings — set as environment variables for runtime tweaking
datagovuk_query: "climate"
ckan_query: "climate"
ckan_rows: 5

# k6 container image
image: grafana/k6:0.55.0

# Test profile configuration
test_profile: "baseline"  # baseline, stress, isolation, or sustained
isolation_endpoint: ""    # For isolation profile: which endpoint to test alone

# Test stage configuration — set as environment variables for runtime tweaking
vus: 50                # Peak virtual users for baseline test
warmup_duration: "2m"  # Warm-up ramp
ramp_duration: "2m"    # Time to ramp to peak
soak_duration: "25m"   # Hold at peak VUs for this duration

# Pass/fail thresholds for each endpoint (milliseconds) — set as environment variables for runtime tweaking
thresholds:
  search_ui_threshold_ms: 500              # Search UI p(95) < 500ms
  package_search_threshold_ms: 2000        # Package search p(95) < 2s
  package_list_threshold_ms: 2000          # Package list p(95) < 2s
  package_show_threshold_ms: 3000          # Package show p(95) < 3s
  organization_show_threshold_ms: 3000     # Organization show p(95) < 3s
  harvest_source_list_threshold_ms: 2000   # Harvest source list p(95) < 2s
  harvest_object_threshold_ms: 3000        # Harvest object p(95) < 3s
  error_rate_threshold: 0.01               # Error rate < 1%

# Prometheus remote write — push k6 metrics to existing GOV.UK Prometheus
# Set remoteWriteUrl to enable live Grafana visibility during the test
# GOV.UK Prometheus Operator URL: http://prometheus-operated.monitoring:9090/api/v1/write
prometheus:
  remoteWriteUrl: ""
  # Stats exported per trend metric — visible as separate series in Grafana
  trendStats: "avg,p(95),p(99)"

# Resource limits for the k6 pod in Kubernetes
resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 128Mi

# Job suspension — keeps the job dormant until manually unsuspended
# Set to false to start the test: kubectl patch job ndl-load-test-k6 -n datagovuk --type=merge -p '{"spec":{"suspend":false}}'
suspended: true

# How long to keep the completed job before automatic cleanup (seconds)
# 3600 = 1 hour — gives team time to view logs before pod is removed
ttlSecondsAfterFinished: 3600

# Persistent volume configuration for log storage
storage:
  enabled: true
  size: 1Gi
  storageClassName: gp2  # AWS EBS storage class
